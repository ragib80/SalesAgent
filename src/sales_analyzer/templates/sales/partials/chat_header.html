<!-- Chat Header -->
<div class="chat-header" role="banner">
  <div class="chat-title">
    <div class="header-brand-icon" aria-hidden="true">
      <i class="bi bi-bar-chart-line-fill"></i>
    </div>
    <div class="dropdown">
      <button class="btn btn-link dropdown-toggle p-0 text-decoration-none"
              type="button" id="modelDropdown" data-bs-toggle="dropdown"
              aria-expanded="false"
              style="color:var(--vs-text); font-size:14.5px; font-weight:600; letter-spacing:-.01em;">
        <span id="current-model">Y Sales</span>
      </button>
      <ul class="dropdown-menu" aria-labelledby="modelDropdown" id="modelMenu">
        <li><button class="dropdown-item" type="button" data-selector=".y-sales">Y Sales</button></li>
        <li><button class="dropdown-item" type="button" disabled style="opacity:.45;">Coming soon</button></li>
      </ul>
    </div>
  </div>

  <div class="chat-actions">
    <!-- Theme toggle -->
    <button id="theme-toggle"
            aria-label="Toggle dark/light mode"
            title="Toggle theme">
      <i class="bi bi-moon-fill" aria-hidden="true"></i>
    </button>

    <!-- Prompt Helper -->
    <button class="action-btn" type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#promptHelperCanvas"
            aria-controls="promptHelperCanvas"
            title="Open prompt helper">
      <i class="bi bi-sliders" aria-hidden="true"></i>
      <span class="d-none d-sm-inline">Prompt Helper</span>
    </button>
  </div>
</div>
