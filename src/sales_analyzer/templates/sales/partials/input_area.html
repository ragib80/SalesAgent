<!-- Input Area -->
<div class="input-area" role="region" aria-label="Message input">
  <div class="input-container">
    <div class="input-wrapper">
      <textarea class="message-input"
                id="message-input"
                placeholder="Ask about your sales data…"
                rows="1"
                aria-label="Type a message"
                aria-multiline="true"></textarea>

      <!-- Ghost suggestion placeholder (used by auto_complete.js) -->
      <div id="ghost-suggestion"></div>

      <!-- Select2 element (used by auto_complete.js) -->
      <select id="smart-suggestions" style="display:none;"></select>

      <div class="input-actions">
        <span class="char-counter" id="char-counter" aria-live="polite"></span>

        <button class="input-btn send-btn"
                id="send-btn"
                type="button"
                disabled
                aria-label="Send message"
                title="Send (Enter)">
          <i class="bi bi-send-fill" aria-hidden="true"></i>
        </button>
      </div>
    </div>
        <p class="disclaimer"><b>
      Data will be available up to yesterday. </b>
    </p>

    {% comment %} <p class="disclaimer">
      Data will be available up to yesterday. Verify critical figures independently.
    </p> {% endcomment %}
  </div>
</div>
