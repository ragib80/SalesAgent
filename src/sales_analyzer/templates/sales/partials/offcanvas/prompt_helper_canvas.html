<div class="offcanvas offcanvas-end ph-canvas" tabindex="-1" id="promptHelperCanvas">
  <div class="offcanvas-header ph-canvas-header border-bottom">
    <div class="d-flex align-items-center gap-2">
      <i class="bi bi-stars ph-header-icon"></i>
      <h5 class="offcanvas-title mb-0">Prompt Helper</h5>
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>

  <!-- Tab Nav -->
  <div class="ph-tab-nav border-bottom">
    <button class="ph-tab-btn active" data-tab="build">
      <i class="bi bi-sliders2 me-1"></i>Build
    </button>
    <button class="ph-tab-btn" data-tab="suggest">
      <i class="bi bi-lightbulb me-1"></i>Suggest
    </button>
  </div>

  <div class="offcanvas-body ph-canvas-body">

    <!-- ══════════════════════════════════════
         BUILD TAB
    ══════════════════════════════════════ -->
    <div id="ph-tab-build" class="ph-tab-panel">

      <!-- Quick Templates -->
      <div class="ph-section mb-4">
        <p class="ph-section-label">Quick Templates</p>
        <div class="ph-chips">
          <button class="ph-chip"
            data-tpl-metric="Revenue"
            data-tpl-col=""
            data-tpl-text="Show top 10 dealers by revenue this month">
            Top 10 Dealers
          </button>
          <button class="ph-chip"
            data-tpl-metric="MTD Revenue"
            data-tpl-col=""
            data-tpl-text="Show MTD revenue summary by division">
            MTD Summary
          </button>
          <button class="ph-chip"
            data-tpl-metric="Revenue Growth %"
            data-tpl-col="wgbez"
            data-tpl-text="Show declining brands this fiscal year vs last year">
            Declining Brands
          </button>
          <button class="ph-chip"
            data-tpl-metric="YTD Revenue"
            data-tpl-col="spart_text"
            data-tpl-text="Show division-wise YTD revenue vs last year">
            Division vs LY
          </button>
          <button class="ph-chip"
            data-tpl-metric="Revenue"
            data-tpl-col="arktx"
            data-tpl-text="Show top products by revenue this month">
            Top Products
          </button>
          <button class="ph-chip"
            data-tpl-metric="Average Revenue"
            data-tpl-col="cname"
            data-tpl-text="Show average revenue per dealer this fiscal year">
            Avg per Dealer
          </button>
          <button class="ph-chip"
            data-tpl-metric="Transaction Count"
            data-tpl-col="cname"
            data-tpl-text="Show dealers with the most transactions this month">
            Most Transactions
          </button>
          <button class="ph-chip"
            data-tpl-metric="Declining Sales"
            data-tpl-col="cname"
            data-tpl-text="Show top 10 dealers with declining revenue vs last year">
            Declining Dealers
          </button>
        </div>
      </div>

      <!-- Step 1: Metric -->
      <div class="ph-section mb-4">
        <div class="ph-step-label">
          <span class="ph-step-num">1</span>
          <span>Select Metric</span>
        </div>
        <select id="metricSelect" class="form-select form-select-sm mt-2">
          <option value="">-- Choose a metric --</option>
          <optgroup label="Core">
            <option value="Revenue">Revenue</option>
            <option value="Quantity">Quantity (Units Sold)</option>
            <option value="Volume">Volume</option>
          </optgroup>
          <optgroup label="Time-Based">
            <option value="MTD Revenue">MTD Revenue</option>
            <option value="YTD Revenue">YTD Revenue (Fiscal)</option>
            <option value="Previous Month Revenue">Previous Month Revenue</option>
            <option value="Last Quarter Revenue">Last Quarter Revenue</option>
          </optgroup>
          <optgroup label="Comparative">
            <option value="Revenue Growth %">Revenue Growth % (YoY)</option>
            <option value="Revenue vs Last Year">Revenue vs Last Year</option>
            <option value="Average Revenue">Average Revenue</option>
            <option value="Declining Sales">Declining Sales</option>
          </optgroup>
          <optgroup label="Rankings">
            <option value="Top Dealers by Revenue">Top 10 Dealers by Revenue</option>
            <option value="Top Products by Revenue">Top 10 Products by Revenue</option>
            <option value="Top Brands by Revenue">Top 10 Brands by Revenue</option>
            <option value="Top Divisions by Revenue">Top 10 Divisions by Revenue</option>
          </optgroup>
          <optgroup label="Other">
            <option value="Transaction Count">Transaction Count</option>
            <option value="Contribution %">Contribution %</option>
          </optgroup>
        </select>
      </div>

      <!-- Step 2: Filters -->
      <div class="ph-section mb-4">
        <div class="ph-step-label">
          <span class="ph-step-num">2</span>
          <span>Add Filters <span class="ph-optional">(optional)</span></span>
        </div>
        <select id="availableColumns" class="form-select form-select-sm mt-2" multiple>
          <option value="cname">Dealer</option>
          <option value="wgbez">Brand</option>
          <option value="arktx">Product Name</option>
          <option value="matkl">Material Group</option>
          <option value="spart_text">Division</option>
          <option value="bukrs">Company Code</option>
          <option value="vkorg">Sales Org</option>
          <option value="vtweg">Distribution Channel</option>
          <option value="gsber">Business Area / Depo</option>
          <option value="kkber">Credit Control Area</option>
          <option value="kukla">Dealer Group</option>
          <option value="ktokd">Account Group</option>
          <option value="vkgrp_c">Sales Group</option>
          <option value="vkbur_c">Sales Office</option>
          <option value="Payer_DL">Payer ID</option>
          <option value="matnr">Product Code / Material Code</option>
          <option value="meins">Material UoM</option>
          <option value="voleh">Volume Unit</option>
          <option value="GK">Business Group</option>
          <option value="Territory">Territory</option>
          <option value="Szone">Sales Zone</option>
          <option value="fkdat">Date</option>
          <option value="kunrg">Dealer Code</option>
          <option value="vbeln">Invoice Number</option>
        </select>
        <div id="selectedFiltersContainer" class="mt-3"></div>
      </div>

      <!-- Generate Button -->
      <div class="d-grid mb-3">
        <button type="button" class="btn ph-btn-generate" id="applyFiltersBtn">
          <i class="bi bi-stars me-1"></i>Generate Prompt
        </button>
      </div>

      <!-- Step 3: Results -->
      <div id="generatedPromptsWrapper" style="display:none;">
        <div class="d-flex align-items-center justify-content-between mb-2">
          <div class="ph-step-label mb-0">
            <span class="ph-step-num">3</span>
            <span>Choose a Prompt</span>
          </div>
          <button class="btn btn-sm btn-link text-danger p-0 lh-1" id="clearAllPromptsBtn" title="Clear all prompts">
            <i class="bi bi-trash"></i>
          </button>
        </div>
        <div id="generatedPromptsContainer"></div>
      </div>

    </div><!-- /ph-tab-build -->

    <!-- ══════════════════════════════════════
         SUGGEST TAB
    ══════════════════════════════════════ -->
    <div id="ph-tab-suggest" class="ph-tab-panel" style="display:none;">
      <p class="text-muted small mb-3">
        Type a partial question and get AI-powered prompt suggestions based on your conversation context.
      </p>
      <div class="mb-2">
        <textarea id="ph-suggest-input"
                  class="form-control form-control-sm ph-suggest-textarea"
                  rows="3"
                  placeholder="e.g. Show me top dealers by…"></textarea>
      </div>
      <div class="d-grid mb-3">
        <button type="button" id="ph-suggest-btn" class="btn ph-btn-generate">
          <i class="bi bi-lightbulb me-1"></i>Get Suggestions
        </button>
      </div>
      <div id="ph-suggest-results"></div>
    </div><!-- /ph-tab-suggest -->

  </div><!-- /offcanvas-body -->
</div>
