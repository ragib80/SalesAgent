<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice of Sales Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        body {
            background: #f5f7fb;
            color: #1f2937;
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }

        .login-title {
            color: #111827;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
        }

        .login-subtitle {
            color: #6b7280;
            font-size: 0.97rem;
            margin-bottom: 1.5rem;
        }

        .btn-microsoft {
            align-items: center;
            background: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            color: #ffffff;
            display: flex;
            font-weight: 650;
            justify-content: center;
            min-height: 46px;
            text-decoration: none;
        }

        .btn-microsoft:hover,
        .btn-microsoft:focus {
            background: #1d4ed8;
            border-color: #1d4ed8;
            color: #ffffff;
        }

        .account-switch {
            color: #2563eb;
            display: inline-block;
            font-size: 0.92rem;
            margin-top: 0.8rem;
            text-decoration: none;
        }

        .account-switch:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        .section-divider {
            align-items: center;
            color: #6b7280;
            display: flex;
            font-size: 0.82rem;
            gap: 0.75rem;
            margin: 1.5rem 0 1.25rem;
            text-transform: uppercase;
        }

        .section-divider::before,
        .section-divider::after {
            background: #e5e7eb;
            content: "";
            flex: 1;
            height: 1px;
        }

        .form-control {
            border-color: #d1d5db;
            border-radius: 6px;
            min-height: 44px;
        }

        .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.12);
        }

        .btn-local {
            border-radius: 6px;
            font-weight: 650;
            min-height: 44px;
        }

        .alert-msg {
            border-radius: 6px;
            font-size: 0.94rem;
            padding: 0.65rem 0.85rem;
        }
    </style>
</head>
<body>
<div class="container d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
        <div class="login-card">
            <div class="text-center">
                <div class="login-title">Voice of Sales</div>
                <div class="login-subtitle">Sign in to continue</div>
            </div>

            <a id="microsoft-login" class="btn-microsoft w-100" href="/api/user/microsoft/login/">
                Sign in with Microsoft
            </a>

            <div class="text-center">
                <a id="microsoft-switch" class="account-switch" href="/api/user/microsoft/login/?prompt=select_account">
                    Use another Microsoft account
                </a>
            </div>

            <div id="login-error" class="alert alert-danger alert-msg mt-3 d-none"></div>

            {% comment %} <div class="section-divider">Local account</div>

            <form id="local-login-form" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username"
                           placeholder="Enter local username" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password"
                           placeholder="Enter local password" required autocomplete="current-password">
                </div>

                <button type="submit" id="local-login-btn"
                        class="btn btn-outline-dark btn-local w-100 d-flex justify-content-center align-items-center">
                    <span id="local-login-spinner"
                          class="spinner-border spinner-border-sm me-2 d-none"
                          role="status" aria-hidden="true"></span>
                    <span id="local-login-btn-text">Sign in with local password</span>
                </button>
            </form> {% endcomment %}
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
$(document).ready(function () {
    'use strict';

    const params = new URLSearchParams(window.location.search);

    function safeNext(raw) {
        if (!raw || raw.indexOf('//') === 0 || raw.charAt(0) !== '/') {
            return '/api/sales/index/';
        }
        return raw;
    }

    const nextUrl = safeNext(params.get('next'));

    function buildMicrosoftUrl(prompt) {
        const query = new URLSearchParams({ next: nextUrl });
        if (prompt) {
            query.set('prompt', prompt);
        }
        return '/api/user/microsoft/login/?' + query.toString();
    }

    $('#microsoft-login').attr('href', buildMicrosoftUrl(''));
    $('#microsoft-switch').attr('href', buildMicrosoftUrl('select_account'));

    function showError(msg) {
        $('#login-error').text(msg).removeClass('d-none');
    }

    function hideError() {
        $('#login-error').addClass('d-none').text('');
    }

    const microsoftError = params.get('auth_error');
    if (microsoftError) {
        showError(microsoftError);
    }

    function storeLoginPayload(res) {
        localStorage.setItem('auth_token', res.access || '');
        localStorage.setItem('refresh_token', res.refresh || '');
        localStorage.setItem('full_name', res.full_name || '');
        localStorage.setItem('designation', res.designation || '');
        localStorage.setItem('username', res.username || '');
        localStorage.setItem('user_uuid', res.user_uuid || '');
    }

    function goToApp() {
        window.location.replace(nextUrl);
    }

    (function checkAlreadyLoggedIn() {
        const token = localStorage.getItem('auth_token');
        const refresh = localStorage.getItem('refresh_token');
        if (!token && !refresh) {
            return;
        }

        function tryRefresh() {
            if (!refresh) {
                localStorage.clear();
                return;
            }
            $.ajax({
                url: '/api/user/token/refresh/',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ refresh: refresh }),
                success: function (resp) {
                    localStorage.setItem('auth_token', resp.access || '');
                    if (resp.refresh) {
                        localStorage.setItem('refresh_token', resp.refresh);
                    }
                    goToApp();
                },
                error: function () {
                    localStorage.clear();
                }
            });
        }

        if (token) {
            $.ajax({
                url: '/api/user/whoami/',
                method: 'GET',
                headers: { Authorization: 'Bearer ' + token },
                success: goToApp,
                error: function (xhr) {
                    if (xhr.status === 401) {
                        tryRefresh();
                    }
                }
            });
        } else {
            tryRefresh();
        }
    })();

    $('#local-login-form').on('submit', function (e) {
        e.preventDefault();
        hideError();

        const $btn = $('#local-login-btn');
        const $spinner = $('#local-login-spinner');
        const $text = $('#local-login-btn-text');

        $btn.prop('disabled', true);
        $spinner.removeClass('d-none');
        $text.text('Signing in...');

        $.ajax({
            url: '/api/user/login/',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                username: $('#username').val().trim(),
                password: $('#password').val()
            }),
            success: function (res) {
                storeLoginPayload(res);
                goToApp();
            },
            error: function (xhr) {
                const msg = xhr.responseJSON && xhr.responseJSON.detail
                    ? xhr.responseJSON.detail
                    : 'Login failed. Please check your credentials.';
                showError(msg);
            },
            complete: function () {
                $btn.prop('disabled', false);
                $spinner.addClass('d-none');
                $text.text('Sign in with local password');
            }
        });
    });
});
</script>
</body>
</html>
