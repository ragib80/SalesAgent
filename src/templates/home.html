<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to SAP SALES Info</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(120deg, #f3f4f6 0%, #e9ecef 100%);
            min-height: 100vh;
        }
        .navbar {
            background: #fff !important;
            border-bottom: 1px solid #e5e7eb;
            box-shadow: 0 2px 6px 0 rgba(60,60,60,.02);
        }
        .navbar-brand {
            color: #202123 !important;
            font-weight: 700;
            letter-spacing: 1px;
            font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        }
        .hero-card {
            background: #fff;
            border-radius: 2rem;
            box-shadow: 0 6px 24px 0 rgba(60,60,60,0.09);
            padding: 3rem 2rem 2.5rem 2rem;
            margin-top: 3rem;
            margin-bottom: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }
        .hero-btn {
            padding: 0.9rem 2.4rem;
            border-radius: 1.7rem;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 2px 12px 0 rgba(60,60,60,0.07);
            background: linear-gradient(90deg, #202123 70%, #343541 100%);
            color: #fff;
            border: none;
            transition: background 0.2s, box-shadow 0.2s;
        }
        .hero-btn:hover {
            background: linear-gradient(90deg, #343541 0%, #202123 100%);
            box-shadow: 0 6px 20px 0 rgba(32,33,35,0.15);
            color: #fff;
        }
        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            color: #202123;
            font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        }
        .hero-lead {
            font-size: 1.3rem;
            color: #555a64;
            font-family: 'Segoe UI', 'Inter', 'Arial', sans-serif;
        }
        .footer {
            background: #fff;
            border-top: 1px solid #e5e7eb;
            color: #868686;
            font-size: 1rem;
        }
        /* Responsive tweaks */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.1rem;
            }
            .hero-card {
                padding: 2rem 1rem;
            }
        }
        /* SVG bot icon color */
        .gpt-icon-bg {
            fill: #f3f4f6;
        }
        .gpt-icon-inner {
            fill: #202123;
            opacity: 0.13;
        }
        .gpt-icon-face {
            fill: #343541;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container">
            <a class="navbar-brand" href="#">SAP  <span style="color:#343541">Y-SALES</span></a>
        </div>
    </nav>

    <main class="container d-flex flex-column align-items-center justify-content-center flex-grow-1">
        <div class="hero-card col-12 col-md-9 col-lg-7">
            <!-- SVG Illustration (ChatGPT-inspired bot icon) -->
            <div class="mb-2">
                <svg width="96" height="96" viewBox="0 0 96 96">
                  <rect x="8" y="20" width="80" height="56" rx="14" class="gpt-icon-bg"/>
                  <rect x="16" y="28" width="64" height="40" rx="10" class="gpt-icon-inner"/>
                  <rect x="34" y="44" width="28" height="8" rx="4" class="gpt-icon-face"/>
                  <circle cx="44" cy="48" r="2" fill="#202123"/>
                  <circle cx="52" cy="48" r="2" fill="#202123"/>
                </svg>
            </div>
            <h1 class="hero-title">Welcome to SAP Y-SALES </h1>
            <p class="hero-lead">
                Your intelligent portal for managing and analyzing SAP sales data, reimagined for clarity and speed.
            </p>
            <a href="{% url 'login-template' %}" class="btn hero-btn mt-2">Get Started</a>
        </div>
    </main>

    <footer class="footer text-center py-3 mt-auto">
        <div class="container">
          &copy; <span id="year"></span> . All rights reserved.
        </div>
    </footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
